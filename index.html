<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibrahim | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --accent-1: #ff0055;
            --accent-2: #8a2be2;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-light: #f0f0f0;
            --whatsapp-color: #25D366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0515 100%);
            min-height: 100vh;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        header { text-align: center; padding: 80px 20px 40px; }

        .name-title {
            font-size: 3.5rem; font-weight: 900;
            background: linear-gradient(to right, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle { font-size: 1.2rem; color: #b3b3b3; max-width: 600px; margin: 0 auto; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 40px 0;
        }

        .card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            cursor: pointer;
            opacity: 0; animation: fadeIn 1s ease forwards;
        }

        .card:hover { transform: translateY(-10px); border-color: var(--accent-2); box-shadow: 0 10px 30px rgba(138, 43, 226, 0.2); }
        .image-container { width: 100%; height: 300px; overflow: hidden; }
        .card-image { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .card-image { transform: scale(1.05); }
        .card-content { padding: 25px; text-align: center; }
        .card-title { font-size: 1.2rem; color: #fff; }

        .whatsapp-container { text-align: center; margin: 50px 0; }
        .whatsapp-btn {
            background: var(--whatsapp-color); color: #fff; padding: 15px 40px;
            text-decoration: none; font-weight: bold; border-radius: 30px;
            transition: 0.3s; display: inline-block;
        }
        .whatsapp-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--whatsapp-color); }
    </style>
</head>
<body>

    <header>
        <h1 class="name-title">Ibrahim</h1>
        <p class="subtitle">Creative Visual Artist | Product Photography & Graphic Design</p>
    </header>

    <div class="container">
        <div class="portfolio-grid">
            <!-- الـ 3 كروت -->
            <div class="card" style="animation-delay: 0.1s;"><div class="image-container"><img src="work1.jpg" class="card-image"></div><div class="card-content"><h2 class="card-title">Artistic Product Shot</h2></div></div>
            <div class="card" style="animation-delay: 0.2s;"><div class="image-container"><img src="work2.jpg" class="card-image"></div><div class="card-content"><h2 class="card-title">Commercial Branding</h2></div></div>
            <div class="card" style="animation-delay: 0.3s;"><div class="image-container"><img src="work3.jpg" class="card-image"></div><div class="card-content"><h2 class="card-title">Visual Content</h2></div></div>
        </div>

        <div class="whatsapp-container">
            <a href="https://wa.me/966534657849" target="_blank" class="whatsapp-btn">Chat on WhatsApp</a>
        </div>
    </div>
</body>
</html>
